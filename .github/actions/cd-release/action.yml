name: cd-release
description: >-
  Reusable tatara CD primitive. mode=tag cuts the next semver git tag from a
  merged PR's semver:* label; mode=bump pattern-rewrites a parent repo's pin(s)
  and opens a bot-authored auto-merge PR (coalescing into cd/deploy-train for
  the terminal tatara-helmfile parent).

inputs:
  mode:
    description: tag | bump
    required: true
  token:
    description: bot PAT (TATARA_CD_TOKEN) for tag push + cross-repo PR creation
    required: true
  # --- mode=bump only ---
  parent_repo:
    description: "owner/name of the consumer repo to bump (e.g. szymonrychu/tatara-helmfile)"
    required: false
    default: ""
  pins:
    description: >-
      JSON array of {file, pattern, value_template} describing the pin(s) to
      rewrite in the parent. All pins are rewritten in ONE commit.
    required: false
    default: "[]"
  new_value:
    description: "version to write into the pins (e.g. v1.4.0)"
    required: false
    default: ""
  pr_label:
    description: label applied to the bump PR (a dependency bump is a patch)
    required: false
    default: "semver:patch"

outputs:
  version:
    description: "mode=tag: the newly-cut tag (e.g. v1.4.0)"
    value: ${{ steps.tag.outputs.version }}
  pr_url:
    description: "mode=bump: the opened/reused parent PR URL"
    value: ${{ steps.bump.outputs.pr_url }}

runs:
  using: composite
  steps:
    - name: ensure gh CLI
      shell: bash
      run: |
        set -euo pipefail
        shopt -s inherit_errexit
        # Self-hosted ARC runner images lack gh; hosted runners have it.
        if command -v gh >/dev/null 2>&1; then exit 0; fi
        GH_VER=2.63.2
        curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VER}/gh_${GH_VER}_linux_amd64.tar.gz" \
          | tar -xz -C "$RUNNER_TEMP" "gh_${GH_VER}_linux_amd64/bin/gh"
        mkdir -p "$RUNNER_TEMP/bin"
        mv "$RUNNER_TEMP/gh_${GH_VER}_linux_amd64/bin/gh" "$RUNNER_TEMP/bin/gh"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/bin/gh" --version

    - name: cut tag
      id: tag
      if: ${{ inputs.mode == 'tag' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ACTION_PATH: ${{ github.action_path }}
        REPO: ${{ github.repository }}
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        shopt -s inherit_errexit
        source "$ACTION_PATH/gh-lib.sh"
        PY="$(command -v python3 || command -v python)"

        # Key the label lookup on the CHECKED-OUT commit, not github.sha. On
        # workflow_run consumers github.sha is the default-branch HEAD at run
        # time, which can race ahead if a second merge lands between the ci run
        # and the release run (reading the wrong PR's semver:* label or none).
        # All consumers check out the right ref (push: HEAD==github.sha;
        # workflow_run: checkout ref=head_sha), so HEAD is correct for both.
        SHA="$(git rev-parse HEAD)"

        # 1. find the merged PR for the pushed commit and read its semver:* label
        #
        # The read and the verdict are separate on purpose. A single `|| true`
        # over the whole pipeline (what this was until #622) collapses "the
        # forge is down" into "there is no semver label", and the second is a
        # refusal to tag a release that MUST be tagged. The whole JSON is
        # fetched and parsed by python rather than filtered with `--jq
        # '.[0].labels[].name'`, because that filter makes gh exit nonzero when
        # no PR is found at all - indistinguishable, at the exit status, from
        # the 503 this is trying to tell apart.
        if ! prs="$(retry "gh pr list --search $SHA" \
            gh pr list --search "$SHA" --state merged --json number,labels)"; then
          echo "::error::could not read the merged PR for $SHA from the forge; refusing to tag on an unknown label set." >&2
          exit 1
        fi
        level="$(printf '%s' "$prs" | "$PY" -c '
        import json, sys
        prs = json.load(sys.stdin)
        levels = [l["name"].split(":", 1)[1]
                  for pr in prs[:1] for l in pr["labels"]
                  if l["name"] in ("semver:major", "semver:minor", "semver:patch")]
        print(levels[0] if levels else "")')"
        if [ -z "$level" ]; then
          echo "::error::no semver:(major|minor|patch) label on the merged PR for $SHA; refusing to tag." >&2
          exit 1
        fi
        echo "significance level: $level"

        # Authenticate origin BEFORE the fetch, not just before the push. The
        # wrapper checks out with persist-credentials: false (its tag push needs
        # the PAT to win over checkout's read-only extraheader), which leaves
        # origin with NO credential at all - so an unauthenticated fetch against
        # a private repo fails every time. That is survivable only while the
        # failure is discarded, and it is about to stop being discarded.
        git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"

        # Both guards below read the tag set: the re-run check and the
        # monotonic next-tag counter. A silently-discarded fetch leaves that
        # set truncated, and the counter then re-cuts a version that already
        # exists. Retry, keep stderr, and fail rather than compute on it.
        if ! retry "git fetch --tags" git fetch --tags --force origin >/dev/null; then
          echo "::error::could not fetch tags from origin; refusing to compute the next tag from a truncated tag set." >&2
          exit 1
        fi

        # 2. Re-run safety: if a semver tag already points at HEAD, an earlier
        # attempt of THIS release already cut it. Reuse it; do not cut a second.
        # Two semver tags on one commit is not benign: a consumer's build.sh
        # `git describe --tags` resolves to the LOWER of them, so the image gets
        # published under the previous version while the chart and the deploy
        # pins carry the new one. That is exactly what wedged the wrapper on
        # 2026-07-30: attempt 1 cut v1.3.4 then died in `publish image`, the
        # re-run cut v1.3.5 on the same commit, the image went out as :v1.3.4,
        # and every agent pod sat in ImagePullBackOff on a :v1.3.5 that was
        # never pushed. Consumers now take VERSION from this step's output, so
        # this guard is defence in depth on top of that.
        existing="$(git tag --points-at HEAD --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
        if [ -n "$existing" ]; then
          echo "commit $SHA is already tagged $existing (re-run of a release that tagged before failing); reusing it"
          echo "version=$existing" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # 3. compute the next tag from the latest existing semver tag (seeded)
        latest="$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
        next="$("$PY" "$ACTION_PATH/semver-bump.py" "$latest" "$level")"
        echo "latest=${latest:-<seed>} level=$level next=$next"

        # 4. push the tag (bot-authored; origin was authenticated above)
        if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
          echo "tag $next already exists locally; skipping create"
        else
          git tag "$next"
        fi
        # Push via token URL: checkout's persisted credential is the default
        # GITHUB_TOKEN, read-only on repos with restrictive default workflow
        # permissions (wrapper). Mirrors bump mode's authenticated URL.
        git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/tags/$next"

        echo "version=$next" >> "$GITHUB_OUTPUT"

    - name: bump parent
      id: bump
      if: ${{ inputs.mode == 'bump' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TOKEN: ${{ inputs.token }}
        ACTION_PATH: ${{ github.action_path }}
        PARENT: ${{ inputs.parent_repo }}
        PINS: ${{ inputs.pins }}
        NEW_VALUE: ${{ inputs.new_value }}
        PR_LABEL: ${{ inputs.pr_label }}
        SELF_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        shopt -s inherit_errexit
        source "$ACTION_PATH/gh-lib.sh"
        PY="$(command -v python3 || command -v python)"

        if [ -z "$PARENT" ] || [ -z "$NEW_VALUE" ]; then
          echo "::error::mode=bump requires parent_repo and new_value." >&2
          exit 1
        fi

        component="${SELF_REPO##*/}"
        work="$(mktemp -d)"
        # Each attempt clears the destination first: a half-finished clone
        # leaves a non-empty directory that fails every later attempt with
        # "already exists and is not an empty directory". The retry label
        # carries no argv - the clone URL embeds the bot PAT.
        clone_parent() {
          rm -rf "$work"
          git clone "https://x-access-token:${TOKEN}@github.com/${PARENT}.git" "$work"
        }
        if ! retry "git clone ${PARENT}" clone_parent >/dev/null; then
          echo "::error::could not clone ${PARENT}." >&2
          exit 1
        fi
        git -C "$work" config user.name "szymonrychu-bot"
        git -C "$work" config user.email "szymonrychu-bot@users.noreply.github.com"
        cd "$work"

        if [ "$PARENT" = "szymonrychu/tatara-helmfile" ]; then
          # === terminal hop: coalesce into the cd/deploy-train branch ===
          # Each component adds/updates ONLY its own pin as a SEPARATE commit on
          # the shared branch (so a bad pin reverts without dropping the others).
          branch="cd/deploy-train"
          pushed=""
          for attempt in $(seq 1 8); do
            # Not `2>&1 >/dev/null`: this fetch decides which commit the pin is
            # applied on top of, so its failure must not be invisible.
            if ! retry "git fetch ${PARENT}" git fetch origin --prune >/dev/null; then
              echo "::error::could not fetch ${PARENT}; refusing to rebuild the pin on stale refs." >&2
              exit 1
            fi
            if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              git checkout -B "$branch" "origin/$branch"
            else
              git checkout -B "$branch" "origin/main"
            fi
            "$PY" "$ACTION_PATH/apply-pins.py" "$PINS" "$NEW_VALUE"
            git add -A
            if git diff --cached --quiet; then
              echo "deploy-train already carries ${component}@${NEW_VALUE}; nothing to commit"
              pushed="noop"
              break
            fi
            git commit -m "cd: bump ${component} to ${NEW_VALUE}"
            if git push origin "HEAD:$branch"; then
              pushed="yes"
              break
            fi
            echo "deploy-train advanced under us; rebase-retry ${attempt}"
            sleep "$attempt"
          done
          if [ -z "$pushed" ]; then
            echo "::error::could not push to cd/deploy-train after 8 rebase-retries." >&2
            exit 1
          fi
          # A no-op means "apply-pins produced no diff against the branch as it
          # is now". That is TWO different states and they need opposite
          # handling, so the branch-vs-main comparison - not `pushed` - is the
          # discriminator:
          #
          #  - branch merged, pin is in main. Falling through here 422s: `gh pr
          #    list` finds nothing open and `gh pr create` refuses ("No commits
          #    between main and cd/deploy-train"). Under `set -e` that fails the
          #    calling job, which on a caller with `needs:` jobs behind it (the
          #    skills release and its sync-contract fan-out) silently skips
          #    them. Exit 0: there is genuinely nothing left to do.
          #
          #  - branch is AHEAD of main, i.e. the pin is pushed but the PR is not
          #    armed. Reachable whenever a prior run died after the push and
          #    before/inside `gh pr merge --auto` below, and also without any
          #    re-run at all if the push landed server-side but git reported
          #    failure and the retry loop then saw its own commit. Falling
          #    through is exactly right: open_or_reuse_pr REUSES the open PR
          #    (no create, no 422) and the label + auto-merge arming below run.
          #    Exiting here instead would strand a pushed pin behind an unarmed
          #    PR, green - the failure shape this whole task exists to close.
          if [ "$pushed" = "noop" ]; then
            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch" ||
               [ "$(git rev-list --count "origin/main..origin/$branch")" -eq 0 ]; then
              echo "$branch is not ahead of main; this pin already landed, nothing to open"
              exit 0
            fi
            echo "$branch already carries this pin and is still open; re-arming its PR"
          fi
          pr_title="cd: deploy-train"
          pr_body="Automated deploy-train. Coalesced component pin bumps; each commit is one component. Auto-merges on a green helmfile diff."
        else
          # === non-terminal parent (e.g. wrapper): independent per-bump PR ===
          branch="cd/bump-${component}-${NEW_VALUE}"
          git checkout -B "$branch" "origin/main"
          "$PY" "$ACTION_PATH/apply-pins.py" "$PINS" "$NEW_VALUE"
          git add -A
          if git diff --cached --quiet; then
            echo "${PARENT} already pins ${component}@${NEW_VALUE}; nothing to do"
            exit 0
          fi
          git commit -m "cd: bump ${component} to ${NEW_VALUE}"
          git push -f origin "HEAD:$branch"
          pr_title="cd: bump ${component} to ${NEW_VALUE}"
          pr_body="Automated dependency bump of ${component} to ${NEW_VALUE}."
        fi

        # The pin is pushed by here. Everything below is what makes it MERGE,
        # so every step of it is explicitly status-checked: a pushed pin behind
        # a PR that was never opened, never labelled or never armed is invisible
        # to the release (bump goes green) and fatal to the deploy (#622).
        if ! pr_url="$(open_or_reuse_pr "$PARENT" "$branch" "$pr_title" "$pr_body")"; then
          # The PR can merge between the branch check above and the list/create
          # inside open_or_reuse_pr, and the forge then refuses to create one
          # ("No commits between main and $branch"). A merged branch is the
          # SUCCESS state; re-read it rather than fail the release on it. Same
          # discriminator as the no-op guard: level with main, or gone.
          if retry "git fetch ${PARENT}" git fetch origin --prune >/dev/null &&
             { ! git show-ref --verify --quiet "refs/remotes/origin/$branch" ||
               [ "$(git rev-list --count "origin/main..origin/$branch")" -eq 0 ]; }; then
            echo "::notice::${branch} merged while this run was opening its PR; the pin has landed."
            exit 0
          fi
          exit 1
        fi
        arm_pr "$PARENT" "$pr_url" "$PR_LABEL" || exit 1

        echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
        echo "opened/updated parent PR: $pr_url"
