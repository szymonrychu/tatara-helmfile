name: apply

on:
  push:
    branches: [main]

# Serializes cluster applies (semver push-CD design 8a.2): coalesced
# cd/deploy-train merges queue here rather than racing or superseding each
# other, so at most one `helmfile apply` is in flight. (Group name diverges
# from the spec's `cd-apply`; the existing name is kept - the property that
# matters is the serialized, non-cancelling queue.)
concurrency:
  group: tatara-helmfile-apply
  cancel-in-progress: false

jobs:
  helmfile-apply:
    runs-on: arc-runner-tatara-helmfile
    env:
      # Harbor uses the in-cluster kubernetes robot (robot$kubernetes) to pull the
      # OCI charts. The GH secret holds the LIVE working token (sourced from the
      # gitlab-runner ns `regcred`, which builds/pushes daily); the op .env copy
      # of this token was stale. GPG key is op-sourced (sops decrypt).
      GPG_PRIVATE_RSA_B64: ${{ secrets.GPG_PRIVATE_RSA_B64 }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_ROBOT_KUBERNETES_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_ROBOT_KUBERNETES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Hard block, checked before anything else spins up. The PR-time
      # `diff.yaml` gate covers the reviewed-PR path only; a placeholder
      # reaching main by any other route (direct push, admin merge, a revert
      # landing one) would otherwise apply to the live cluster with nothing
      # objecting, since this job runs on push to main with a cluster-admin
      # ServiceAccount and the Project CRD has no schema validation (it
      # renders spec verbatim via toYaml). Same check as diff.yaml's
      # equivalent step, repeated here rather than trusted to have already run.
      - name: block unresolved values placeholders
        run: |
          if grep -rn "PLACEHOLDER_" values/; then
            echo "::error::Unresolved PLACEHOLDER_ sentinel(s) in values/ (see above)."
            echo "::error::A placeholder marks a value pending an unpublished upstream tag - fill in the real value before this can apply. This job runs cluster-admin and the Project CRD has no schema validation, so a placeholder here would be applied to the cluster as-is."
            exit 1
          fi
          echo "No PLACEHOLDER_ sentinels found in values/."

      - name: install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: mise install (helm/helmfile/kubectl/sops + plugins)
        run: |
          eval "$($HOME/.local/bin/mise activate bash)"
          mise install
          mise reshim

      - name: import GPG key (sops decrypt)
        run: |
          echo "$GPG_PRIVATE_RSA_B64" | base64 -d | gpg --batch --import

      - name: harbor OCI login
        run: |
          eval "$($HOME/.local/bin/mise activate bash)"
          printf '%s' "$HARBOR_PASSWORD" | helm registry login harbor.szymonrichert.pl -u "$HARBOR_USERNAME" --password-stdin

      - name: helmfile apply
        shell: bash
        run: |
          eval "$($HOME/.local/bin/mise activate bash)"
          helmfile -e default apply --suppress-secrets

      # The Project + Repository enrollment CRs (and per-project scm Secrets) are
      # applied by the helmfile presync hook ONLY when a release actually syncs.
      # A no-op apply (releases already at target, e.g. the initial adoption)
      # skips sync -> the hook does not fire -> nothing is reconciled. Apply them
      # explicitly here so enrollment is deterministic on every run (idempotent;
      # in-cluster SA). Mirrors .hook.sh: plain manifests applied directly,
      # *.secrets.yaml sops-decrypted first (a raw kubectl apply of an encrypted
      # file fails with "unexpected GroupVersion string: ENC[...]").
      - name: reconcile enrollment CRs (Project + Repository + scm Secrets)
        # `shell: bash` is `bash --noprofile --norc -eo pipefail`; the default
        # for `run:` is `bash -e` with NO pipefail, which makes
        # `sops -d | kubectl apply` take its status from kubectl alone - a
        # failed decrypt applies nothing and reports success (#398). `-u` is
        # deliberately not set: `mise activate` is third-party shell on the
        # cluster's only apply path and nounset over it buys nothing here.
        shell: bash
        run: |
          eval "$($HOME/.local/bin/mise activate bash)"
          rc=0
          # `find -exec cmd \;` reports find's own traversal status, never
          # cmd's, so a rejected enrollment CR used to report success from the
          # very step whose comment above promises deterministic enrollment.
          # Both halves loop instead, attempt every file, and report together.
          # Read from a process substitution, NOT `find | while`: a piped loop
          # body runs in a subshell, where `rc` is set on a copy that dies with
          # it and the fix would silently do nothing. A process substitution in
          # turn discards find's OWN traversal status (an unreadable raw tree
          # enrolls nothing and reports success), so each loop waits on it.
          while IFS= read -r -d '' f; do
            kubectl apply -f "$f" < /dev/null || { echo "::error::kubectl apply -f $f failed"; rc=1; }
          done < <(find values/tatara-operator/raw -maxdepth 1 -name '*.yaml' ! -name '*.secrets.yaml' -print0)
          wait "$!" || { echo "::error::find over $PWD/values/tatara-operator/raw failed: exit $?"; rc=1; }
          while IFS= read -r -d '' f; do
            sops -d "$f" < /dev/null | kubectl apply -f - || { echo "::error::sops -d $f | kubectl apply -f - failed"; rc=1; }
          done < <(find values/tatara-operator/raw -maxdepth 1 -name '*.secrets.yaml' -print0)
          wait "$!" || { echo "::error::find over $PWD/values/tatara-operator/raw (secrets) failed: exit $?"; rc=1; }
          exit "$rc"
