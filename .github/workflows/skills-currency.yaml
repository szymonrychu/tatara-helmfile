name: skills-currency

# Scheduled staleness check on `agent.skillsRef` (#397). Deliberately NOT on
# pull_request and NOT part of lint.yaml:
#
# - It fetches tatara-agent-skills' tag list, so it cannot live in
#   check_pin_coverage.py without costing that merge gate its offline,
#   stdlib-only, pre-commit-runnable contract.
# - Staleness is a fleet condition, not a property of the PR in front of you.
#   A gate that is legitimately red while an unrelated deploy train is in
#   flight gets weakened to a warning, then deleted. That is how #397's
#   remedy ended up structurally blind to #397.
#
# Its job is to notice the ONE thing uniformity cannot see: the skills bump hop
# deleted, renamed, or never wired. Hosted runner, no secrets, no cluster - the
# skills repo is public, so `git ls-remote` needs no token.

on:
  schedule:
    # 06:15 UTC daily, off the 03:30Z cluster re-roll window.
    - cron: '15 6 * * *'
  workflow_dispatch:

jobs:
  currency:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the issue channel below. GitHub routes scheduled-run failure mail
      # to whoever last touched the cron file - here, the bot. Without a
      # channel this check reproduces #397 with an extra step in it: a daily
      # red nobody reads.
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: agent.skillsRef currency against tatara-agent-skills
        id: check
        run: |
          set -o pipefail
          python .github/scripts/check_skills_currency.py 2>&1 \
            | tee "${RUNNER_TEMP}/currency.log"

      # `failure()`, NOT `failure() && steps.check.conclusion == 'failure'`: a
      # setup-python 500 or a checkout rate-limit skips `check`, and gating on
      # its conclusion would then file nothing while the run still goes red -
      # a fail-OPEN channel wrapped around a script whose whole contract is
      # fail-closed. Any red run gets an issue; the run URL in the body tells
      # infra flake from real staleness.
      #
      # Dedup is an exact open-title match, not `gh issue search`: that index is
      # eventually consistent, so a daily job would race it and file duplicates.
      # A red run with the issue already open adds nothing - no daily comment,
      # because a channel that generates noise is a channel that gets muted.
      # The title is interpolated into the jq filter rather than read from
      # `env.TITLE`, so dedup does not rest on gh's embedded gojq being built
      # with an env loader; if it were not, this would file a duplicate a day.
      #
      # GH_REPO, not the checkout's remote: `gh` must still work in exactly the
      # case the condition above was widened for, where checkout is what failed.
      #
      # Deliberately NO `tatara` trigger label: an agent Task minted off this
      # issue would close it by hand-editing the three pins, which is the
      # hand-management #397 removed. This is a human signal on purpose.
      - name: File the staleness issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'agent.skillsRef currency check is red'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --limit 200 --json number,title \
            --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")"
          if [ -n "$existing" ]; then
            echo "already tracked in #${existing}; not filing a duplicate"
            exit 0
          fi
          {
            echo "The scheduled \`skills-currency\` run failed."
            echo
            echo '```'
            cat "${RUNNER_TEMP}/currency.log" 2>/dev/null \
              || echo "(check_skills_currency.py did not run; an earlier step failed)"
            echo '```'
            echo
            echo "Do NOT close this by hand-editing \`skillsRef\` in the values files."
            echo "That pin is CD-managed by tatara-agent-skills' \`Bump tatara-helmfile"
            echo "skillsRef\` release step (#397): a hand bump is overwritten by the next"
            echo "skills release while the real fault stays open."
            echo
            echo "Run: ${RUN_URL}"
          } > "${RUNNER_TEMP}/issue.md"
          gh issue create --title "$TITLE" --body-file "${RUNNER_TEMP}/issue.md"

      # Close the loop, so an open issue always means "still stale". Without
      # this the channel decays into a permanently-open issue nobody rereads.
      #
      # continue-on-error: bookkeeping must never red the check it bookkeeps
      # for. A transient `gh` error here would otherwise turn a GREEN currency
      # run red, with the step above already skipped so no issue explains it.
      - name: Close the staleness issue once current
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'agent.skillsRef currency check is red'
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --limit 200 --json number,title \
            --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")"
          if [ -z "$existing" ]; then
            exit 0
          fi
          gh issue close "$existing" \
            --comment "Currency check is green again; closed by the scheduled run."
