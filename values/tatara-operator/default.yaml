# Manager replicas: 3 for HA (leaderElection:true -> 1 active, 2 standby).
replicaCount: 3

# Manager Pod placement. Cluster-specific by rule 14: the chart defaults every
# one of these EMPTY and renders nothing when unset, so this is the only place
# they exist.
#
# nodeAffinity is REQUIRED, not preferred. This cluster has ZERO taints, so a
# control-plane node is just a labelled worker and nothing otherwise keeps the
# manager off worker-jtw3f33 (dedicated to CI runners) or nas-d0w363i (the NAS,
# where the agent wrapper pods live, see agentScheduling below). Exists on
# node-role.kubernetes.io/control-plane matches the three schedulable
# control-plane nodes kubernetes-47d28x2 / -5vv07x2 / -jhv07x2.
#
# podAntiAffinity is REQUIRED too. replicaCount is 3 and there are exactly 3
# control-plane nodes, so one-per-node is achievable AND is the entire point of
# running 3 replicas: a required rule turns "two managers on one node" into a
# visible scheduling failure rather than a silent HA regression that only shows
# up when that node dies. The selector is the chart's own
# tatara-operator.selectorLabels (release name and chart name are both
# "tatara-operator"); keep it in sync if the release is ever renamed - the same
# caveat the PDB in raw/operator-pdb.tatara-operator.pre.yaml carries.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: tatara-operator
            app.kubernetes.io/instance: tatara-operator

# REQUIRED companion to the anti-affinity above, not a tuning preference. The
# default RollingUpdate surges 25% (rounds up to 1 extra pod); with 3
# required-anti-affine replicas on exactly 3 eligible nodes that surge pod has
# nowhere to land, sits Pending, and the rollout never completes. maxSurge: 0 +
# maxUnavailable: 1 makes it delete-then-replace one node at a time, which
# always fits. Cost is a brief 2/3 during upgrades, which leader election
# already tolerates.
#
# Compatible with raw/operator-pdb.tatara-operator.pre.yaml (maxUnavailable: 1),
# for two independent reasons: a Deployment rolling update deletes pods directly
# through the apps controller and never goes through the eviction API a PDB
# gates; and the budget is maxUnavailable-shaped, matching this rollout exactly
# (a minAvailable: 3 budget would have been the deadlock case, which is why that
# file chose maxUnavailable).
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

ingress:
  enabled: true
  host: tatara.szymonrichert.pl
  # path "/" lets the operator own /operator/webhooks and the REST routes
  # internally (no rewrite double-strip). Confirm against
  # internal/webhook/server.go route prefix before apply; adjust path and
  # externalWebhookBase together if the operator registers routes under a
  # sub-prefix.
  path: /
  className: nginx

# External base used to render Project.status.webhookURL. Must match the public
# host + the operator's internal webhook route prefix.
externalWebhookBase: "https://tatara.szymonrichert.pl/operator/webhooks"

# Callback URL: the internal Service the wrapper POST-s turn results to.
# Must match the tatara-operator-internal Service DNS + INTERNAL_ADDR port.
callbackUrl: "http://tatara-operator-internal.tatara.svc:8082"

# Per-Project memory Ingress placement (operator-stamps these at runtime). The
# 2026-06-15 audit de-baked these from the chart (rule 14); supply them here so
# operator-created memory ingresses keep nginx routing + the path rewrite the
# chart used to hardcode. ingressClassName feeds the ConfigMap INGRESS_CLASS_NAME
# (distinct from the operator's own chart Ingress .ingress.className above).
ingressClassName: "nginx"
ingressRewriteTarget: "/$2"

# Agent (wrapper) Pod securityContext + placement. The 2026-06-15 audit defaulted
# agentRunAsNonRoot=true with an empty runAsUser; the wrapper image declares a
# NON-NUMERIC USER ("agent", uid 10001 via useradd), so kubelet cannot verify
# non-root and rejects every agent pod (CreateContainerConfigError). Pin the
# numeric UID so runAsNonRoot can be verified. As of operator c6b315f the chart
# defaults agentRunAsNonRoot=false (cluster-agnostic), so the helmfile opts into
# non-root here by setting BOTH the flag and the numeric uid (the chart fail-renders
# if the flag is true without a uid). Keep agent pods OFF the untainted control-plane
# nodes by pinning to the nas worker (label nas=true).
agentRunAsNonRoot: true
agentRunAsUser: 10001
agentScheduling:
  nodeSelector:
    nas: "true"

# Placement for the per-Project grafana-mcp Deployments the operator STAMPS
# (rule 6 single JSON document -> MCP_SCHEDULING ConfigMap key, parsed at
# operator boot). Before this existed the operator gave them no constraints at
# all and two grafana-mcp-* Deployments landed on worker-jtw3f33, the node
# dedicated to CI runners.
#
# nodeAffinity REQUIRED, for the same reason as the manager's above: no taints
# anywhere, so only an explicit rule keeps these off the CI-runner and NAS nodes.
#
# podAntiAffinity PREFERRED, deliberately NOT required. One grafana-mcp
# Deployment exists per Project with spec.grafana.enabled (2 today, 3 project
# releases in helmfile.yaml.gotmpl, more possible). A required cross-MCP rule
# over kubernetes.io/hostname would cap the whole fleet at 3 pods - one per
# control-plane node - and a 4th Project enabling Grafana would sit Pending
# forever with nothing pointing back here. It would also break routine image
# bumps: each stamped Deployment is 1 replica on the DEFAULT RollingUpdate
# (maxSurge 1) and the operator exposes no strategy knob for them, so at 3 MCP
# pods the surge pod would have no eligible node. Preferred spreads them in
# practice and degrades gracefully.
mcpScheduling:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: grafana-mcp

# Per-Project memory stack images (the operator stamps these into the native
# objects it provisions per Project). memoryBaseUrl removed in N4: each Project
# now exposes its own endpoint via status.memory.endpoint.
memoryImage: "harbor.szymonrichert.pl/containers/tatara-memory:v0.4.6"
lightragImage: "harbor.szymonrichert.pl/proxy-ghcr/hkuds/lightrag@sha256:67ccf8d9f74eb29da872bf8b3e6513605f5ac601fb0509c5b0ca16d98d2d307d"
neo4jImage: "neo4j:2026.04.0"
# Read-only grafana-mcp the operator provisions per Project that enables
# spec.grafana (incident-response). Pinned to the version already proven in this
# cluster (ai/grafana-mcp). Operator stamps it into GRAFANA_MCP_IMAGE.
grafanaMcpImage: "grafana/mcp-grafana:0.17.0"
# Shared OpenAI Secret (ns tatara, key LLM_BINDING_API_KEY) every per-Project
# lightrag reads. Created out-of-band (gated step in N4 runbook).
openaiSecretName: "lightrag-openai"

# Per-Project memory monitoring (issue #203 / #200 point 1). The operator stamps
# these labels (MEMORY_MONITOR_LABELS, a JSON object like agentScheduling above)
# onto the per-Project memory ServiceMonitor, PrometheusRule, and cnpg PodMonitor
# it provisions, so the cluster kube-prometheus-stack serviceMonitorSelector /
# ruleSelector match them. The chart bakes no default (cluster-agnostic, rule 14).
# release=prometheus is the label this cluster's ruleSelector requires: the only
# rule group Prometheus loads is the stack's own, from file
# monitoring-prometheus-kube-prometheus-*-rules (kube-prometheus-stack release
# "prometheus" in ns monitoring), and the memory PrometheusRule was absent until
# labelled. The memory ServiceMonitor is already scraped (serviceMonitorSelector
# is broader here), so this is a no-op for it and the knob that activates the
# memory alerts. This cluster shares one selector label across both selectors
# (kube-prometheus-stack default); a cluster that splits them needs a second knob.
memoryMonitoring:
  additionalLabels:
    release: prometheus

# In-cluster service endpoints.
oidcIssuer: "https://auth.szymonrichert.pl/realms/master"
oidcAudience: "tatara-operator"
operatorOidcClientId: "tatara-operator"

# Secret names the operator references (cluster-managed, not chart-rendered).
anthropicSecretName: "tatara-anthropic"
cliOidcSecretName: "tatara-cli-oidc"
scmSecretName: "tatara-scm"

# imagePullSecret: cluster-specific pull secret for operator-spawned workloads
# (neo4j, lightrag, tatara-memory, cnpg Cluster). Harbor's proxy-dockerhub
# requires authentication; regcred is the standard pull secret in this cluster.
imagePullSecret: "regcred"

# Ingester image the ingest Job runs (must be published to harbor first).
ingesterImage: "harbor.szymonrichert.pl/containers/tatara-memory-repo-ingester:v0.2.11"

# S3 conversation persistence (issue #114). The operator + wrapper store/restore
# each issue's Claude conversation transcript in this bucket so a fresh pod
# resumes the prior conversation. The bucket + creds are provisioned by the
# rook-ceph ObjectBucketClaim in raw/conversation-bucket.tatara-operator.pre.yaml
# (which auto-creates Secret tatara-conversations holding
# AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY). The feature stays off until the
# operator + wrapper images are bumped to a build carrying the #114 code (chart
# pin in helmfile.yaml.gotmpl + image.tag in common.yaml); the currently-pinned
# published builds ignore these keys, so wiring them now is forward-compatible.
#
# VERIFY at deploy (tatara-deploy-harness): s3Endpoint must be the rook-ceph RGW
# service the OBC reports in its generated ConfigMap (BUCKET_HOST:BUCKET_PORT).
# The value below is the conventional rook-ceph pattern; confirm the object-store
# name and port against the live cluster.
s3Endpoint: "http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc"
s3Bucket: "tatara-conversations"
# Ceph RGW ignores the region but the AWS SDK requires one for request signing.
s3Region: "us-east-1"
# Namespacing within the bucket; the wrapper prepends this to every object key.
s3KeyPrefix: "conversations"
# Ceph RGW (and MinIO) need path-style addressing; AWS S3 would use false.
s3ForcePathStyle: true
# The OBC-generated Secret (same name as the OBC) holding the AWS_* creds.
s3SecretName: "tatara-conversations"
# Metric-name prefix allowlist for the operator push-receiver
# (PUSH_METRICS_ALLOWED_PREFIXES). Widened past the chart default
# ("wrapper_,agent_,memory_,ingest_") so the Grafana-routed alert rules can see the
# wrapper/agent/analyzer/scip/semantic/llm/push series the agent pods push-forward.
# Without this the ccw_*/tatara_wrapper_* series are dropped as reserved_name and the
# wrapper metric alerts stay dark.
pushMetricsAllowedPrefixes: "wrapper_,agent_,memory_,ingest_,ccw_,tatara_wrapper_,analyzer_,scip_,semantic_,llm_,push_"

# Token-budget admission gate (issue #189) in claudeSubscription mode: gate on the
# wrapper-reported Claude 5h/weekly usage percentages (agents read their own usage %
# from Claude API responses and report it back). Pause proactive work (brainstorm/
# implement/review) at 50% and incident work at 80% of the window, resuming on reset.
# claudeSubscription mode needs NO /api/oauth/usage OAuth token - the shared fleet
# `claude setup-token` lacks the user:profile scope that endpoint requires (403), so
# usageEnabled stays false and this wrapper-reported path is used instead. No
# customWindow inputs (resetSchedule/window/tokenLimit) are needed in this mode.
tokenBudgetEnabled: true
tokenBudgetMode: "claudeSubscription"
tokenBudgetProactivePercent: 50
tokenBudgetEmergencyPercent: 80
