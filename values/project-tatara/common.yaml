namespace: tatara

project:
  name: tatara
  spec:
    scmSecretRef: tatara-scm
    triggerLabel: tatara
    # item-4a activation: requires tatara-operator >= the release that ships
    # Project.spec.autoApproveTataraProposals (CRD field). Do not apply this
    # chart bump before that operator release is merged and published.
    autoApproveTataraProposals: true
    # Per-repo fan-out: lanes run up to maxConcurrentAgents agents at once across
    # all repos.
    # Realistic steady-state (2026-07-04): full concurrency + brainstorm on, to
    # observe whether the tiering/effort/cadence improvements slow subscription
    # burn vs the pre-improvement runaway.
    # 4h pod life. agentPodTTLSeconds defaults to 3600, which would TTL-stop a
    # pod an hour in and make the 7200 turn timeout below unreachable. Pod-TTL
    # expiry is the GRACEFUL path (contract G.7: handoff turn, handoff note,
    # synthetic fallback), so a longer pod life is safe - it is the turn-timeout
    # path that tears a pod down hard.
    agentPodTTLSeconds: 14400
    maxConcurrentAgents: 7
    # maxLivePods: the ceiling on simultaneously LIVE Tasks (refined,
    # under-implementation, awaiting-review) - NOT just conversations. The
    # operator default is 2, which on a 5-agent project leaves 3 agent slots
    # that live work can never use, and that is what starves the review queue:
    # measured 2026-08-09, project-tatara sat at live=2/2 with a single review
    # running while five PRs waited, and comment-driven unparks were declined
    # `no-live-room`.
    #
    # The operator clamps this to maxConcurrentAgents-1 (api MaxLivePods), so 4
    # is the largest legal value here and still reserves one slot for
    # non-conversational work. Raising it above 4 would silently clamp, not
    # bind.
    maxLivePods: 6
    # Creation budget (non-terminal Task cap). Set above maxConcurrentAgents so the
    # hourly brainstorm always has a creation slot.
    maxOpenTasks: 6
    # operator#429: default AlertCapacity() is 1, so a single investigating
    # incident head-of-line-blocks every other incident for its whole
    # investigation window. Reserve 3 concurrent slots for the alert class.
    queue:
      alertCapacity: 3
    agent:
      # Per-kind tiering (token-conservation component 1): project-wide fallback
      # is Opus/high; only clarify+review drop to Sonnet with low/medium
      # effort. All other kinds (brainstorm, refine, implement, incident,
      # documentation) inherit the high fallback. xhigh->high everywhere it
      # stays Opus.
      effort: high
      model: claude-opus-5
      modelByKind:
        clarify: claude-sonnet-5
        review: claude-sonnet-5
      effortByKind:
        clarify: low
        review: medium
      image: harbor.szymonrichert.pl/containers/tatara-claude-code-wrapper:v2.2.0
      # Per-Task cumulative output-token runaway backstop for the turn-uncapped
      # implement/issueLifecycle kinds. TUNE from the component-6 per-kind token
      # telemetry; this is a safety ceiling, not a cost lever.
      maxTaskTokens: 3000000
      maxTurnsPerTask: 100
      permissionMode: bypassPermissions
      # Pin the agent-skills install (kills the `main` drift; component 5
      # / component 4b). HAND-MANAGED: tatara-agent-skills release.yml bumps
      # the wrapper Dockerfile's TATARA_SKILLS_REF, NOT this value, so this pin
      # overrides the image's baked ref and does not move on its own. Move all
      # three projects together - .github/scripts/check_pin_coverage.py fails
      # the build if they diverge, and check_agent_pins() there also refuses
      # this AND the image tag above if either goes floating (main/latest) or absent.
      skillsRef: v2.0.0
      # 7200s of INACTIVITY, not wall-clock. The operator anchors the deadline
      # on max(turn-started-at, turn-last-activity-at); wrapper v2.0.2 (#152)
      # starts the transcript tailer at turn submit rather than at the first
      # Stop hook, so the activity anchor now advances during a turn and the
      # window is a true idle timeout. Before that fix the anchor was frozen
      # and this behaved as a hard cap on the whole turn - which is what killed
      # mtg-decks#18 mid-work at 60 minutes with nothing pushed.
      turnTimeoutSeconds: 7200
    # Read-only Grafana incident-response: the operator provisions a per-project
    # grafana-mcp (Viewer SA token) + an alert-webhook receiver at
    # /operator/webhooks/tatara/grafana. Secret keys: serviceAccountToken (mounted
    # into grafana-mcp) + webhookSecret (the bearer the Grafana Tatara contact point
    # presents). Mirrors the infrastructure Project; the SA token + webhookSecret are
    # reused from infrastructure (same read-only Viewer), webhookSecret must equal
    # TF_VAR_tatara_webhook_secret in terraform/grafana.
    grafana:
      enabled: true
      url: http://prometheus-grafana.monitoring.svc.cluster.local
      secretRef: tatara-grafana
    # Post-merge documentation agent: a merge to any enrolled component's
    # default branch spawns a documentation Task that updates the central docs
    # repo (tatara-documentation, already enrolled below) if the change is
    # doc-relevant, opening an auto-merge MR gated on mkdocs build --strict.
    documentation:
      enabled: true
      repo: "https://github.com/szymonrychu/tatara-documentation"
    memory:
      # Volume sizing (pgStorage / pgWalStorage / neo4jStorage) is shared across
      # every project in values/memory-stack.yaml - do not re-declare it here.
      # Instance count stays per-project: this is the platform's own
      # self-hosting stack, so it runs a 3-member HA cluster.
      pgInstances: 3
    scm:
      provider: github
      guidance: >-
        This project is self-hosting: its repositories (the tatara operator,
        cli, wrapper, memory, ingester, and helmfile) ARE the autonomous-agent
        platform you and the other agents run on. Treat the operational
        infrastructure as in-scope, not only application features: the helm
        charts, the tatara-helmfile releases and deploy pipeline, the CI
        workflows and build tooling, the k8s/ARC-runner/Ceph/memory-backend
        configuration, and the incidents recorded in each repository's
        MEMORY.md. When you find a recurring operational failure or a gap in
        the platform's reliability or observability, propose improvements to
        that infrastructure.
      owner: szymonrychu
      botLogin: szymonrychu-bot
      # Bot commit-author identity for agent commits (GitHub noreply links commits
      # to the szymonrychu-bot account by author email).
      botEmail: 143486966+szymonrychu-bot@users.noreply.github.com
      # Issue #102: szymonrychu is the sole trusted maintainer/approver AND the
      # sole human reporter. maintainerLogins makes only his comment count as the
      # approval go-ahead; reporterLogins drops issues/comments from anyone else
      # (the bot stays a trusted insider, so autonomous brainstorm/health-check
      # issues still flow), closing the prompt-injection vector.
      maintainerLogins:
        - szymonrychu
      reporterLogins:
        - szymonrychu
      mergePolicy: afterApproval
      prReactionScope: labeledOrMentioned
      priorityLabel: tatara/priority
      cron:
        brainstorm:
          # Demand-driven since operator v1.35: NO schedule. The operator refills
          # toward targetOpenProposals on a level-triggered reconcile pass and
          # chains sessions back to back off the Task-completion watch edge. It
          # stops only when an agent reports action=exhausted, and resumes on a
          # foreign push, an operator merge for a clarify/incident/takeover Task,
          # a maintainer comment or close, or the tatara.dev/brainstorm-resume
          # annotation.
          enabled: true
          # Backlog TARGET, not a cap: the operator refills toward this level
          # across ALL repos and launches the next session the moment a
          # maintainer approves or discards one. It never closes a proposal to
          # reconcile downward.
          targetOpenProposals: 3
          # Activate the stale-proposal reaper (operator #199): auto-close bot
          # proposals with no human engagement after 14 days.
          staleProposalDays: 14
          sources:
            - docs
            - memory
            - internet
        issueScan:
          maxPerRepo: 1
          # Stretched hourly -> every 4h (token conservation); webhooks cover real
          # issue activity, so the backstop scan can be less frequent.
          schedule: 0 */4 * * *
        # Project refiner: periodic grooming of open + recently-closed issues
        # across all repos - closes duplicates and already-implemented proposals,
        # tightens scope, splits too-broad issues, files followups. It USED to
        # ride the brainstorm cron as a pre-scan barrier; brainstorm has no cron
        # any more, so it carries its own schedule. Empty schedule disables it.
        refine:
          schedule: 0 6 * * *
          closedLookbackDays: 30
        documentation:
          schedule: 0 3 * * *

repositories:
  # tatara docs repo dropped 2026-07-07: it is private and szymonrychu-bot is
  # not a collaborator, so every clone 404s (`git clone ... tatara: exit 128`).
  # It sorted first (prefix of all tatara-*) so it was the deterministic primary
  # repo (projectscan.go sort-by-name) -> project-scoped refine/brainstorm/docs
  # tasks BootCrashLoop on the primary clone. Removing it makes tatara-agent-skills
  # the new (bot-clonable) primary. Re-add only if the bot is granted access.
  - name: tatara-helmfile
    spec:
      url: "https://github.com/szymonrychu/tatara-helmfile"
      defaultBranch: main
      ingestEnabled: true
      semanticIngest: true
      reingestSchedule: "0 6 * * *"
  - name: tatara-memory
    spec:
      url: "https://github.com/szymonrychu/tatara-memory"
      defaultBranch: main
      semanticIngest: true
      reingestSchedule: "17 6 * * *"
  - name: tatara-cli
    spec:
      url: "https://github.com/szymonrychu/tatara-cli"
      defaultBranch: main
      semanticIngest: true
      reingestSchedule: "34 6 * * *"
  - name: tatara-operator
    spec:
      url: "https://github.com/szymonrychu/tatara-operator"
      defaultBranch: main
      semanticIngest: true
      reingestSchedule: "51 6 * * *"
  # tatara-chat dropped 2026-08-08 (#280): the release is `installed: false`
  # (decommissioned, accepted data loss), so enrolling it bought a daily
  # LLM-semantic re-ingest of a repo nothing reads. Re-add if it is ever
  # reinstalled.
  - name: tatara-memory-repo-ingester
    spec:
      url: "https://github.com/szymonrychu/tatara-memory-repo-ingester"
      defaultBranch: main
      semanticIngest: true
      reingestSchedule: "8 7 * * *"
  - name: tatara-claude-code-wrapper
    spec:
      url: "https://github.com/szymonrychu/tatara-claude-code-wrapper"
      defaultBranch: main
      semanticIngest: true
      reingestSchedule: "25 7 * * *"
  - name: tatara-observability
    spec:
      url: "https://github.com/szymonrychu/tatara-observability"
      defaultBranch: main
      semanticIngest: true
      reingestSchedule: "42 7 * * *"
  - name: tatara-documentation
    spec:
      url: "https://github.com/szymonrychu/tatara-documentation"
      defaultBranch: main
      semanticIngest: true
      reingestSchedule: "59 7 * * *"
  - name: tatara-agent-skills
    spec:
      url: "https://github.com/szymonrychu/tatara-agent-skills"
      defaultBranch: main
      semanticIngest: true
      reingestSchedule: "16 8 * * *"
