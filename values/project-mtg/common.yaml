namespace: tatara

project:
  name: mtg
  spec:
    scmSecretRef: tatara-scm
    triggerLabel: mtg
    # The auto-approve SEVERITY CEILING (tatara-operator#639). Unrestricted here:
    # mtg ships no platform code and no infrastructure - a bad change costs a
    # revert, not an outage - so there is nothing a maintainer comment buys that
    # is worth parking every self-proposed chain for. The other four carve-out
    # axes still hold: bot-authored, marked, and anchor-matching, or no
    # auto-approval at all.
    autoApproveMaxSignificance: major
    # 5 concurrent agents with an EXPLICIT live-pod ceiling of 3 below.
    #
    # The history that set these: maxLivePods used to be unset, so the operator
    # clamped the live ceiling to maxConcurrentAgents-1 (api/v1alpha1.MaxLivePods),
    # and at maxConcurrentAgents: 2 that was a ceiling of ONE. Measured
    # 2026-08-09: one implement Task held the single slot for over an hour while
    # two others, whose agents had asked real questions and whose human answers
    # were already queued as pendingEvents, were refused re-entry every 30s with
    # decline=no-live-room. The reply is the lowest-priority thing in the project
    # under a ceiling of 1, because the ceiling is only enforced on the unpark
    # path and not on the mint path - new work walks past it while an answered
    # conversation cannot get back in.
    #
    # maxLivePods: 3 is what fixes that: a refresh pass in flight, a second deck
    # being worked, and one resuming conversation. maxConcurrentAgents: 5 sits
    # above it so the pod ceiling is the binding one and is stated rather than
    # derived. Refresh coverage does NOT depend on these numbers - see the
    # upgrade cron note at the foot of this file.
    maxConcurrentAgents: 5
    # OWNER DECISION 2026-08-09: explicit 3 (not the maxConcurrentAgents-1=4
    # clamp, not the operator's unset default of 2).
    maxLivePods: 3
    # 6, the operator default, stated explicitly (a kubebuilder default is
    # applied on WRITE and never reaches an already-existing Project CR). At 3
    # it equalled maxOpenUpgrades, so on refresh days the deck passes consumed
    # the entire project task budget and the issueScan sweep refused every mint
    # with capHit(maxOpenTasks) - refreshes starved issue intake for the whole
    # morning. 6 leaves intake room alongside the upgrade lanes below.
    maxOpenTasks: 6
    # 4h pod life: the repo's longest Workflow research pipeline runs ~3h in a
    # single turn; the 3600 default TTL-stopped it mid-run.
    agentPodTTLSeconds: 14400
    # operator#429: default AlertCapacity() is 1, so a single investigating
    # incident head-of-line-blocks every other incident for its whole
    # investigation window. Reserve 3 concurrent slots for the alert class.
    queue:
      alertCapacity: 3
    agent:
      effort: high
      model: claude-opus-5
      # clarify + review pinned to claude-opus-5 explicitly (not left to the
      # operator's kindDefaultModel) so a future default change can't silently
      # downgrade them; both inherit project-default effort: high. Unlike
      # project-tatara/project-infrastructure, mtg does NOT tier these down to
      # sonnet - deck research is the reasoning-heaviest work on the platform.
      modelByKind:
        clarify: claude-opus-5
        review: claude-opus-5
      image: harbor.szymonrichert.pl/containers/tatara-claude-code-wrapper:v3.7.2
      maxTaskTokens: 2000000
      permissionMode: bypassPermissions
      # CD-MANAGED as of #397 by the skills release, mtg included - the earlier
      # "mtg is hand-managed" carve-out does not apply to this pin. See the note
      # in values/project-tatara/common.yaml. Do not hand-edit;
      # check_pin_coverage.py's check_agent_pins() refuses a floating or absent
      # value here or on the image tag above.
      skillsRef: v3.0.0
      # 3600s of INACTIVITY is now the STALL PROBE TRIGGER, not a kill
      # deadline (post-O2). The operator anchors on max(turn-started-at,
      # turn-last-activity-at) including subagent activity, and on expiry
      # sends `POST /v1/probe` rather than failing the turn: an answered
      # probe clears the annotations and the turn continues unbounded.
      # Escalation to interrupt+stop only fires after stallProbeMaxAttempts
      # unanswered probes, each waited out over stallProbeGraceSeconds.
      turnTimeoutSeconds: 3600
      # O1/O2 CRD fields (defaults 300/2) made explicit.
      stallProbeGraceSeconds: 300
      stallProbeMaxAttempts: 2
      # mtg-decks ships its own workflow skills (no profiles: frontmatter ->
      # wildcard -> installed for every agent kind). Cloned with the project's
      # scmSecretRef token via the wrapper's global GIT_TOKEN credential helper.
      skillSources:
        - name: mtg-decks
          url: https://github.com/szymonrychu/mtg-decks
          ref: main
          subdir: .claude/skills
      # Deck work MUST go through the repo's own skills, never freeform. The "*"
      # text reaches every kind; a per-kind block is additive on top of it.
      promptAppendByKind:
        "*": |
          All deck work in this repo MUST go through the repo's own workflow
          skills - never freeform. Brainstorm/brew a deck with build-deck,
          forge-deck, choose-archetype, meta-analysis, or set-impact. Optimize or
          tune a deck with optimize-deck, sideboard-guide, or prep-tournament.
          Review and risk-check with ban-watch and the research-protocol gates.
          These skills live in the mtg-decks checkout; run them from the repo root.
          Before any research pipeline, bootstrap the repo toolchain once:
          `mise install && mise run setup` at the mtg-decks repo root (provides
          python + matplotlib and the graphviz dot shim that preflight requires).
          PDF export is optional: generate one only if the human explicitly
          asked; skipping it otherwise is normal, not a degradation.
        brainstorm: |
          Pick this cycle's proposal from the priority-ordered menu below.
          Work the categories in order and stop at the first one that yields
          real work. The repo is checked out at
          /workspace/szymonrychu/mtg-decks; read before you propose.

          1. METHODOLOGY GAPS the repo has already recorded against itself.
             Highest priority because the repo's own notes name them. Known
             open ones: `net_delta` is documented as a synergy-fit heuristic
             rather than a validated win-rate gain, and has twice been used
             to justify declining a swap; `statistics_matchups` returned no
             data across three research passes; `sideboard_hint` is
             unimplemented. Propose validating one of them, replacing it, or
             removing it and saying so in the notes that cite it.
          2. VALIDATION TOOLING. `verify_pages.py` describes its own checks
             as heuristic regexes, and the preflight severity policy decides
             what actually blocks a pass. The pytest suite under
             `scripts/tests/` is existing scaffolding to extend, not new
             machinery to invent.
          3. SKILLS NEVER INVOKED. Seven of the thirteen repo skills have
             never run: meta-analysis, ban-watch, choose-archetype,
             set-impact, forge-deck, prep-tournament, log-results. Propose
             the one whose output the repo would actually use next, and say
             what it would be used for.
          4. A DECK THAT IS ACTUALLY STALE by the repo's own drift standard:
             `scripts/meta_state.py diff`. Directory mtime is NOT the
             standard. A deck untouched for a week whose metagame has not
             moved is not stale; a deck touched yesterday whose archetype
             shares moved is. If one qualifies, propose an `optimize-deck`
             pass (it dispatches to `research-protocol`) against that deck's
             `decks/<deck>/decklist.txt`, naming the drift you measured.

          Nothing here is scoped to one deck, and nothing is out of scope for
          being a sibling of the deck last worked on. A previous cycle's
          handoff or notes are EVIDENCE about what has been done; they never
          narrow what may be proposed.

          Propose exactly ONE issue. Its body must name which category it
          came from, the file, skill, or deck it targets, and what done looks
          like, in enough detail that the implementing agent needs no further
          context.

          Do NOT run any of this repo's workflow skills yourself, and skip
          the `*` block's `mise install && mise run setup` toolchain
          bootstrap: brainstorm proposes, implement executes, and this cycle
          produces a proposal, not research output. Reading files, `git log`,
          and the spellslinger MCP tools are all fine and expected.

          Only if NOTHING in any of the four categories qualifies, call
          `submit_outcome` with `action="skip"` and a `reason` that states,
          category by category, what you considered and why each one yielded
          nothing. A skip that does not account for all four categories is
          not a valid skip.
        upgrade: |
          THE UPGRADE UNIT ON THIS PROJECT IS ONE DECK, never a dependency pin.
          mtg-decks carries no manifests, no lockfiles and no image tags, which
          is why the project runs `engine: none` - there is nothing here for a
          dependency engine to scan and nothing to bump. Wherever the workflow
          talks about a dependency, a version or a hop, read deck, metagame and
          card change.

          ENUMERATE THE DECKS AT RUN TIME. There is no fixed roster, no slot
          count and no per-deck limit anywhere in this configuration. `ls -d
          decks/*/` in the mtg-decks checkout is the ONLY authoritative list of
          what needs covering; a deck added or deleted in the repo changes your
          workload, never this config. Never work from a deck list you read in a
          prompt, a comment, a previous handoff or your own memory.

          EVERY deck gets a refresh pass each cycle - not one deck, not a fixed
          N. Start from the full enumeration, then subtract what live siblings
          have already claimed; whatever is left is yours, and it may be more
          than one deck. Work them one at a time inside this Task rather than
          leaving a deck behind, and if you run out of budget before the list is
          empty, say in your merge request body exactly which decks you covered
          and which are still uncovered, by name. A deck silently skipped is the
          failure this contract exists to prevent.

          Claim before you work. Call `task_context` with `index=true` first,
          read the merge request titles of the live sibling `upgrade` Tasks, and
          take the decks none of them names. Then name the deck you are on in
          your OWN merge request title, early, so the next sibling can see it.
          Nothing dedupes this for you: the operator does not know what a deck
          is, and a sibling that has not opened its merge request yet is
          invisible to you. If you genuinely cannot tell what is claimed, prefer
          the deck with the oldest refresh in `git log` over guessing.

          If the enumeration turns up decks this project has never touched, that
          is a finding worth reporting in the merge request body, not a reason
          to narrow the pass.

          A deck is STALE by the repo's own drift standard - `scripts/meta_state.py
          diff` - and by nothing else. Directory mtime is NOT the standard: a
          deck untouched for a month whose archetype shares have not moved is
          current, and a deck touched yesterday whose shares moved is stale. Run
          the diff for the deck you claimed and let it decide what the refresh
          is, up to and including "the decklist holds and only the boarding plan
          moves" - that is a real result, not a non-result.

          If none of the decks left to you has drifted, or every deck the
          enumeration found is already claimed by a sibling, call
          `submit_outcome` with `action="declined"` and a `decline_reason`
          quoting what the diff actually said for each deck you checked, or
          naming the sibling that holds it. Note the vocabulary: this kind has NO `skip` action (that is
          brainstorm's), only `submitted` and `declined`. A quiet week is three
          declines and that is the correct outcome, but a decline with no
          measurement in it is not.

          Route the whole refresh through the repo's own workflow skills exactly
          as the `*` block requires: never freeform, never a hand-edited
          decklist. `optimize-deck` is the entry point (it dispatches to
          `research-protocol`) against `decks/<deck>/decklist.txt`, with
          `meta-analysis` for the archetype shares that moved, `set-impact` when
          a new set is what changed, `ban-watch` for a banning or unbanning, and
          `sideboard-guide` when the matchup spread is what moved. Do NOT reach
          for `forge-deck` or `choose-archetype` - this is a refresh of a deck
          that already exists, not a new brew.

          "Read the release notes before you propose the hop" maps here to: read
          the actual set release notes, ban-list announcements and tournament
          results you are reacting to, and cite them in the pull request body. A
          refresh whose only justification is elapsed time is one you should
          decline instead.
        review: |
          As reviewer, be critical but fair. A multi-level review is expected:
          design, decklist choices, simulation evidence, and page structure.
          Catch problems early and hand concrete findings back to the implementor
          to fix. Do not wave work through, and do not nitpick style.
      # The generic per-Project MCP injection: reaches the in-cluster
      # spellslinger MCP HTTP service. No spellslinger code in tatara.
      mcpServers:
        - name: spellslinger
          url: http://spellslinger-mcp-http.spellslinger-development.svc.cluster.local:8080/mcp
          type: http
    # PERSISTENT AGENT WORKSPACE (operator 2.9.0). mtg goes first because it is
    # the smallest surface: 3 repos, a measured 215 MiB tree.
    #
    # This is here for STORAGE GUARANTEES, not speed. Without it /workspace is
    # the container writable layer - volatile (the 2026-08-10 OOMKill of
    # imp-mtg-mtg-decks-i37 took an unpushed commit with it) and unbounded, with
    # no guarantee a node has room for every repo this project clones and
    # builds. It is measurably SLOWER to boot than a fresh shallow clone
    # (measured p50 5.1s resumed against 2.4s for depth-1) and that is an
    # accepted price. Do not disable it to chase boot latency.
    #
    # storageClass is PINNED rather than left to the cluster default: the
    # workspace requires ReadWriteMany, and the operator force-deletes pods with
    # a zero grace period, so an RBD class would stall every respawn in
    # Multi-Attach until the old attachment released.
    workspace:
      enabled: true
      storageClass: rook-ceph-rwx
      size: 10Gi
      # Per-PROJECT build cache (Go build + module, pip, npm, mise downloads).
      # Shared across Tasks on purpose: those caches are content-addressed, so a
      # per-Task cache would be cold on every new Task, which is most of them.
      #
      # 10Gi, sized off what mtg actually stores rather than the chart default.
      # The go-build and go-mod subPaths are dead here - mtg has no Go, and the
      # measured 50-75s per build cycle that motivated the cache is a Go number
      # that does not transfer. What mtg really caches is the pip wheel set that
      # `mise run setup` pulls (matplotlib, the pinned numpy 2.5.1, pytest and
      # transitives - roughly 50-60 MB), plus a trivial npm entry. mise
      # downloads are near-zero because the wrapper image already bakes the
      # python 3.13 the repo asks for. Note the venv itself lives in the repo at
      # .venv, so it rides the per-Task WORKSPACE volume; this cache only buys
      # cross-Task reuse of the downloads.
      cacheEnabled: true
      cacheSize: 10Gi
    memory:
      # Volume sizing (pgStorage / pgWalStorage / neo4jStorage) is shared across
      # every project in values/memory-stack.yaml - do not re-declare it here.
      # This block previously did not exist at all, so mem-mtg-pg ran on
      # whatever the operator's compiled-in fallbacks happened to be (#237: the
      # gap is a project having no declared sizing, not just a wrong number).
      # One instance is a deliberate choice: mtg is a single-repo,
      # single-writer project, so it does not carry the HA cost of a 3-member
      # cluster. There is no standby, hence no replication slot and none of the
      # standby-resync WAL bursts that sized the shared volumes - it inherits
      # them anyway so no stack is left on an unchosen default.
      pgInstances: 1
    # Policy for the scm.cron.upgrade agent below. Top-level spec field, NOT part
    # of the cron block: the cron decides WHEN, this decides what may be proposed.
    #
    # engine none, not renovate: mtg-decks carries no manifests, no lockfiles and
    # no image tags, so a dependency engine has nothing to read and would report
    # an empty candidate set forever. none puts the agent in charge of
    # enumerating its own units, which here are decks - see
    # agent.promptAppendByKind.upgrade above for what that means concretely.
    #
    # majorStrategy is stated even though nothing here has a semver hop, so the
    # resolved policy is readable off the CR instead of coming from a code
    # default. minimumReleaseAge is omitted on purpose: there are no releases to
    # age, so any value would be a fiction.
    upgradePolicy:
      engine: none
      majorStrategy: nextHopOnly
    scm:
      provider: github
      owner: szymonrychu
      botLogin: szymonrychu-bot
      botEmail: 143486966+szymonrychu-bot@users.noreply.github.com
      # kelong and mtg-bientech are maintainers only; deliberately NOT added to
      # reporterLogins. IsAllowedReporter (api/v1alpha1/logins.go) already
      # trusts every maintainer, so a second entry would be redundant.
      maintainerLogins:
        - szymonrychu
        - kelong
        - mtg-bientech
      reporterLogins:
        - szymonrychu
      mergePolicy: afterApproval
      prReactionScope: labeledOrMentioned
      cron:
        brainstorm:
          # Demand-driven since operator v1.35: NO schedule. See the operator's
          # scm.cron.brainstorm docs; enabled still gates the refill pass.
          enabled: true
          # Backlog TARGET, not a cap. The controller refills toward it and
          # never closes a proposal to reconcile downward, so this is the
          # depth of the go/nogo queue the maintainer sees at once.
          targetOpenProposals: 5
          # Auto-close bot proposals with no human engagement after 14 days.
          staleProposalDays: 14
          sources:
            - docs
            - memory
            - internet
        issueScan:
          maxPerRepo: 1
          # B.4 sweep: the sole scheduled intake mechanism, not purely a
          # missed-webhook backstop. Tightened from every-4h to every-10min;
          # see the PR for the cost/safety analysis.
          schedule: "*/10 * * * *"
        # Project refiner, on its own cron since brainstorm stopped having one.
        # Cron is evaluated in UTC: robfig's SpecSchedule.Next does
        # `if loc == time.Local { loc = t.Location() }`, so a bare
        # cron.ParseStandard schedule (no explicit TZ) is evaluated in the base
        # timestamp's location, and the base is a metav1.Time, which is always
        # UTC regardless of the image's tzdata. So `0 12 * * *` is noon UTC =
        # 14:00 Europe/Warsaw (CEST).
        refine:
          schedule: 0 12 * * *
          closedLookbackDays: 30
        # Weekly deck refresh, Tuesday from 07:00 UTC = 09:00 Europe/Warsaw
        # (CEST). UTC for the reason spelled out on refine above. Tuesday
        # because the paper-format ban announcements and the weekend result
        # dumps this project reacts to are both settled by Monday night.
        #
        # EVERY deck gets a refresh pass each week. THE TICK COUNT IS NOT A DECK
        # COUNT and must never be tuned to one: the roster lives in the repo
        # (`ls -d decks/*/`) and the agent enumerates it at run time - see
        # agent.promptAppendByKind.upgrade above, which requires full coverage
        # and an explicit named report of anything left uncovered.
        #
        # The hours are refresh CAPACITY, deliberately more ticks than the repo
        # has decks so that adding or deleting a deck needs no change here. A
        # tick that finds every deck current or claimed declines in seconds and
        # costs nothing.
        #
        # Residual coupling, stated honestly: the operator mints AT MOST ONE
        # upgrade Task per due tick (UpgradeActivity in
        # api/v1alpha1/project_types.go; mint path in
        # internal/controller/projectscan.go), so parallel coverage still comes
        # from tick frequency rather than from an operator-side fan-out. The
        # prompt contract is what makes a roster change safe regardless: with
        # more decks than ticks the pass degrades to "agent covers what it can
        # and names the rest", not to "a deck is silently skipped".
        #
        # An hour apart, deliberately. Sibling dedup is agent-side and works by
        # reading live sibling Tasks' merge request titles, so a sibling that
        # has not opened its MR yet is INVISIBLE and two ticks could claim the
        # same deck. An hour is comfortably longer than a refresh takes to
        # reach its MR (the 2026-08-13 living-end pass took three pod runs),
        # which is what keeps the claims distinct. Do not tighten this to
        # minutes without giving the operator a real fan-out primitive.
        #
        # A week where nothing drifted is a week of declines, and that is the
        # correct outcome, not a failure - the prompt requires the drift
        # measurement in the decline reason.
        #
        # Hours 7-12 keep clear of the mtg-decks reingest at 09:58 only in the
        # sense that no tick lands ON it; a long refresh can still overlap the
        # ingest window, which is tolerable because the ingest is additive.
        # issueScan fires every 10 minutes rather than on the */4 hours, so
        # these hours say nothing about issueScan - and both mint inside the
        # same serialized per-Project reconcile, so a coincident tick is never
        # concurrent.
        #
        # maxOpenUpgrades is EXPLICIT rather than the operator's default: a
        # kubebuilder default is applied on WRITE and never retroactively, so
        # it would never reach this already-existing Project. 4 is a LANE cap,
        # not a deck cap - it bounds how much refresh work is open at once
        # while leaving maxOpenTasks: 6 room for issue intake. Raising or
        # lowering it changes throughput, never coverage.
        upgrade:
          schedule: 0 7-12 * * 2
          maxOpenUpgrades: 4

repositories:
  - name: mtg-decks
    spec:
      url: "https://github.com/szymonrychu/mtg-decks"
      defaultBranch: main
      ingestEnabled: true
      # tatara-project chart requires a 5-field reingestSchedule cron on every
      # Repository entry; not called out in the brief. Same cadence as the
      # project-tatara repos.
      reingestSchedule: "58 9 * * *"
