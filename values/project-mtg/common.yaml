# mtg Project + Repository CRs, codified via the tatara-project chart.
# First project wired to an in-cluster generic MCP server via
# spec.agent.mcpServers (reaches the spellslinger MCP HTTP service; no
# spellslinger code lives in tatara itself).
namespace: tatara

project:
  name: mtg
  spec:
    scmSecretRef: tatara-scm
    triggerLabel: mtg
    maxConcurrentAgents: 2
    maxOpenTasks: 3
    # 4h pod life: the repo's longest Workflow research pipeline runs ~3h in a
    # single turn; the 3600 default TTL-stopped it mid-run.
    agentPodTTLSeconds: 14400
    agent:
      effort: high
      model: claude-opus-5
      # clarify + review pinned to claude-opus-5 explicitly (not left to the
      # operator's kindDefaultModel) so a future default change can't silently
      # downgrade them; both inherit project-default effort: high. Unlike
      # project-tatara/project-infrastructure, mtg does NOT tier these down to
      # sonnet - deck research is the reasoning-heaviest work on the platform.
      modelByKind:
        clarify: claude-opus-5
        review: claude-opus-5
      image: harbor.szymonrichert.pl/containers/tatara-claude-code-wrapper:v1.2.0
      maxTaskTokens: 2000000
      # 400: deck skills run multi-agent research/sim pipelines up to ~3h; 150
      # starved multi-deck tasks. No unlimited exists (0 falls back to the 300
      # default), so this is the effective "do not starve" ceiling.
      maxTurnsPerTask: 400
      permissionMode: bypassPermissions
      skillsRef: v1.5.2
      # Inactivity window, not wall-clock: a streaming 3h Workflow run is safe,
      # but give long quiet Workflow phases a full hour before calling a stall.
      turnTimeoutSeconds: 3600
      # mtg-decks ships its own workflow skills (no profiles: frontmatter ->
      # wildcard -> installed for every agent kind). Cloned with the project's
      # scmSecretRef token via the wrapper's global GIT_TOKEN credential helper.
      skillSources:
        - name: mtg-decks
          url: https://github.com/szymonrychu/mtg-decks
          ref: main
          subdir: .claude/skills
      # Deck work MUST go through the repo's own skills, never freeform. The "*"
      # text reaches every kind; the review text is additive on top of it.
      promptAppendByKind:
        "*": |
          All deck work in this repo MUST go through the repo's own workflow
          skills - never freeform. Brainstorm/brew a deck with build-deck,
          forge-deck, choose-archetype, meta-analysis, or set-impact. Optimize or
          tune a deck with optimize-deck, sideboard-guide, or prep-tournament.
          Review and risk-check with ban-watch and the research-protocol gates.
          These skills live in the mtg-decks checkout; run them from the repo root.
          Before any research pipeline, bootstrap the repo toolchain once:
          `mise install && mise run setup` at the mtg-decks repo root (provides
          python + matplotlib and the graphviz dot shim that preflight requires).
          PDF export is optional: generate one only if the human explicitly
          asked; skipping it otherwise is normal, not a degradation.
        brainstorm: |
          Scope this cycle to EXACTLY ONE deck: the single most recently updated
          deck directory under `decks/` in the mtg-decks checkout at
          /workspace/szymonrychu/mtg-decks.

          Find it first. The brainstorm pod gets a depth-1 shallow clone, so
          `git log` sees only one commit until you deepen the history:
            cd /workspace/szymonrychu/mtg-decks
            git fetch --unshallow || git fetch --deepen=200
            for d in decks/*/; do
              printf '%s %s\n' "$(git log -1 --format=%ct -- "$d")" "$d"
            done | sort -rn | head -1
          The directory on that line is your target. Sort on `%ct` (Unix epoch
          seconds), not `%cI`: the committer's local UTC offset makes a
          13:00+02:00 commit lexicographically outsort a genuinely newer
          12:00Z commit, and mtg-decks mixes +00:00 container-bot commits with
          +02:00 human ones, so that offset can pick the wrong deck. Once you
          have the winning directory, get its date for the proposal with
          `git log -1 --format=%cI -- <dir>` on that directory alone - safe
          now because it is no longer the thing being sorted. `git fetch
          --unshallow` exits non-zero if the clone is already complete; the
          `--deepen=200` fallback covers that and is not an error. If the
          history cannot be deepened and the loop yields no usable
          timestamps, do NOT guess a deck: call `submit_outcome` with
          `action="skip"` and a `reason` naming the git-history failure, and
          stop.

          Propose ONE issue, for that deck only, framed as metagame
          optimization. The issue body must direct the implementing agent to run
          the repo's `optimize-deck` skill (which dispatches to
          `research-protocol`) against that deck's `decks/<deck>/decklist.txt`,
          optimizing the list against the CURRENT metagame. State the deck
          directory you picked and the commit date that made it the newest.

          Do NOT propose work on any other deck. Do NOT run any of this
          repo's workflow skills yourself and skip the `*` block's `mise
          install && mise run setup` toolchain bootstrap too - brainstorm
          proposes, implement executes, and this cycle produces a proposal,
          not research output. If that deck was optimized recently enough
          that another pass would add nothing, call `submit_outcome` with
          `action="skip"` and a `reason`, and stop.
        review: |
          As reviewer, be critical but fair. A multi-level review is expected:
          design, decklist choices, simulation evidence, and page structure.
          Catch problems early and hand concrete findings back to the implementor
          to fix. Do not wave work through, and do not nitpick style.
      # The generic per-Project MCP injection: reaches the in-cluster
      # spellslinger MCP HTTP service. No spellslinger code in tatara.
      mcpServers:
        - name: spellslinger
          url: http://spellslinger-mcp-http.spellslinger-development.svc.cluster.local:8080/mcp
          type: http
    scm:
      provider: github
      owner: szymonrychu
      botLogin: szymonrychu-bot
      botEmail: 143486966+szymonrychu-bot@users.noreply.github.com
      maintainerLogins:
        - szymonrychu
      reporterLogins:
        - szymonrychu
      mergePolicy: afterApproval
      prReactionScope: labeledOrMentioned
      cron:
        # First brainstorm for this project (previously absent -> Enabled=false ->
        # never ran). Cron is evaluated in UTC: robfig's SpecSchedule.Next does
        # `if loc == time.Local { loc = t.Location() }`, so a bare
        # cron.ParseStandard schedule (no explicit TZ) is evaluated in the base
        # timestamp's location, and the base is a metav1.Time, which is always
        # UTC regardless of the image's tzdata. So `0 12 * * *` is noon UTC =
        # 14:00 Europe/Warsaw (CEST).
        brainstorm:
          enabled: true
          # Only one repo in this project, and the mandate is one deck at a time.
          maxOpenProposals: 3
          schedule: 0 12 * * *
          # Auto-close bot proposals with no human engagement after 14 days.
          staleProposalDays: 14
          sources:
            - docs
            - memory
            - internet
        issueScan:
          maxPerRepo: 1
          schedule: 0 */4 * * *

repositories:
  - name: mtg-decks
    spec:
      url: "https://github.com/szymonrychu/mtg-decks"
      defaultBranch: main
      ingestEnabled: true
      # tatara-project chart requires a 5-field reingestSchedule cron on every
      # Repository entry; not called out in the brief. Same cadence as the
      # project-tatara repos.
      reingestSchedule: "0 6 * * *"
