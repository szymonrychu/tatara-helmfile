namespace: tatara

project:
  name: infrastructure
  spec:
    scmSecretRef: infrastructure-scm
    triggerLabel: tatara
    # item-4a activation: requires tatara-operator >= the release that ships
    # Project.spec.autoApproveTataraProposals (CRD field). Do not apply this
    # chart bump before that operator release is merged and published.
    autoApproveTataraProposals: true
    # Realistic steady-state (2026-07-04): un-held to full concurrency so both
    # projects do real work and we can observe whether the tiering/effort/cadence
    # improvements slow the subscription burn.
    # 4h pod life. agentPodTTLSeconds defaults to 3600, which would TTL-stop a
    # pod an hour in and make the 7200 turn timeout below unreachable. Pod-TTL
    # expiry is the GRACEFUL path (contract G.7: handoff turn, handoff note,
    # synthetic fallback), so a longer pod life is safe - it is the turn-timeout
    # path that tears a pod down hard.
    agentPodTTLSeconds: 14400
    maxConcurrentAgents: 7
    # maxLivePods: the ceiling on simultaneously LIVE Tasks (refined,
    # under-implementation, awaiting-review) - NOT just conversations. The
    # operator default is 2, which on a 5-agent project leaves 3 agent slots
    # that live work can never use, and that is what starves the review queue:
    # measured 2026-08-09, project-tatara sat at live=2/2 with a single review
    # running while five PRs waited, and comment-driven unparks were declined
    # `no-live-room`.
    #
    # The operator clamps this to maxConcurrentAgents-1 (api MaxLivePods), so 4
    # is the largest legal value here and still reserves one slot for
    # non-conversational work. Raising it above 4 would silently clamp, not
    # bind.
    maxLivePods: 6
    # Above maxConcurrentAgents so the hourly brainstorm always has a creation slot.
    maxOpenTasks: 6
    # operator#429: default AlertCapacity() is 1, so a single investigating
    # incident head-of-line-blocks every other incident for its whole
    # investigation window. Reserve 3 concurrent slots for the alert class.
    queue:
      alertCapacity: 3
    agent:
      # Per-kind tiering (token-conservation component 1): project-wide fallback
      # is Opus/high; only clarify+review drop to Sonnet with low/medium
      # effort. All other kinds inherit the high fallback. xhigh->high where it
      # stays Opus.
      effort: high
      model: claude-opus-5
      modelByKind:
        clarify: claude-sonnet-5
        review: claude-sonnet-5
      effortByKind:
        clarify: low
        review: medium
      image: harbor.szymonrichert.pl/containers/tatara-claude-code-wrapper:v3.3.1
      # Per-Task cumulative output-token runaway backstop for the turn-uncapped
      # implement/issueLifecycle kinds. TUNE from the component-6 per-kind token
      # telemetry; this is a safety ceiling, not a cost lever.
      maxTaskTokens: 3000000
      permissionMode: bypassPermissions
      # Pin the agent-skills install (kills the `main` drift; component 5
      # / component 4b). HAND-MANAGED: see the note in
      # values/project-tatara/common.yaml. Move all three projects together;
      # check_pin_coverage.py's check_agent_pins() refuses a floating or absent value.
      skillsRef: v2.1.1
      # 3600s of INACTIVITY is now the STALL PROBE TRIGGER, not a kill
      # deadline (post-O2). The operator anchors on max(turn-started-at,
      # turn-last-activity-at) including subagent activity, and on expiry
      # sends `POST /v1/probe` rather than failing the turn: an answered
      # probe clears the annotations and the turn continues unbounded.
      # Escalation to interrupt+stop only fires after stallProbeMaxAttempts
      # unanswered probes, each waited out over stallProbeGraceSeconds.
      turnTimeoutSeconds: 3600
      # O1/O2 CRD fields (defaults 300/2) made explicit.
      stallProbeGraceSeconds: 300
      stallProbeMaxAttempts: 2
    # Read-only Grafana incident-response: operator provisions a per-project
    # grafana-mcp (Viewer SA token) + an alert-webhook receiver at
    # /operator/webhooks/infrastructure/grafana. Secret keys: serviceAccountToken
    # (mounted into grafana-mcp) + webhookSecret (alert bearer).
    grafana:
      enabled: true
      url: http://prometheus-grafana.monitoring.svc.cluster.local
      secretRef: infrastructure-grafana
    # PERSISTENT AGENT WORKSPACE - EXPLICITLY OFF UNTIL STAGE C.
    #
    # This has to be explicit. WorkspaceSpec.Enabled is a tri-state pointer and
    # an ABSENT workspace block resolves to ENABLED (nil means true, so a
    # Project written before the field existed keeps working). So omitting this
    # does NOT opt out - once agentWorkspacePvcEnabled went true operator-wide
    # for mtg's stage B, this project was silently enabled too. Setting it false
    # is the only way to stay on the ephemeral layer.
    #
    # Stage C flips this to true, one project at a time, after mtg has proven
    # the CephFS permissions path: a fresh subvolume is root:root 0755 and the
    # agent runs as uid 10001, so it depends on the chart's agentFsGroup 10001
    # plus fsGroupChangePolicy OnRootMismatch. If that is wrong every pod
    # boot-crash-loops to the 24h residency cap, which is precisely why this
    # rollout is staged rather than fleet-wide.
    #
    # cacheEnabled is left alone deliberately: the per-project build cache is
    # already provisioned and mounts independently of the workspace volume.
    workspace:
      enabled: false
      # The cache is declared NOW even though the workspace is off, so stage C
      # creates it at the right size instead of falling back to the 50Gi chart
      # default. Note the cache only exists while the workspace is enabled -
      # task_workspace.go maintains it under `WorkspaceEnabled() &&
      # WorkspaceCacheEnabled()`, and pod mounting is gated the same way - so
      # this has no effect until stage C flips enabled to true.
      # Sized for what this project actually caches: terraform, ansible and helm
      # work through pip and mise, not a Go build tree, so 10Gi is generous.
      cacheEnabled: true
      cacheSize: 10Gi
    memory:
      # Volume sizing (pgStorage / pgWalStorage / neo4jStorage) is shared across
      # every project in values/memory-stack.yaml - do not re-declare it here.
      # This stack used to carry pgStorage: 10Gi and NO pgWalStorage at all, so
      # it silently ran on a 2Gi WAL volume and repeated the incidents already
      # fixed on project-tatara (#237, #263). Instance count stays per-project.
      pgInstances: 3
    # Policy for the scm.cron.upgrade agent below. It is a top-level spec field,
    # NOT part of the cron block: the cron decides WHEN a Task is minted, this
    # decides what that Task is allowed to propose.
    #
    # Bleeding edge, deliberately. minimumReleaseAge 0 at every level means a
    # version is a candidate the moment it publishes, so a broken release does
    # reach the cluster (grafana v13.0.0 shipped a dashboard-losing migration and
    # was pulled; the fix was v13.0.1). Accepted for this project because it is
    # where an upgrade lands first and where a rollback is cheapest; these fields
    # exist so it can be made conservative without an operator change.
    #
    # renovate runs read-only in the pod and its report is a HINT - the agent
    # still reads the release notes and decides. nextHopOnly walks a multi-hop
    # major chain one deployed Task at a time (the repo's current pin is the
    # cursor), so a bad hop stays bisectable instead of arriving as one
    # unreviewable jump.
    upgradePolicy:
      engine: renovate
      majorStrategy: nextHopOnly
      minimumReleaseAge:
        major: 0
        minor: 0
        patch: 0
    scm:
      provider: gitlab
      owner: szymonrychu
      botLogin: szymonrychu-bot
      # Bot commit-author identity for agent commits (GitLab attributes commits to
      # the szymonrychu-bot account by author email).
      botEmail: sz.ymonrychu@gmail.com
      # The owner is a trusted insider: issues opened by szymonrychu go through
      # normal triage/approval, not third-party autoapprove.
      # Issue #102: szymonrychu is the sole maintainer/approver AND sole human
      # reporter. reporterLogins drops issues/comments from anyone else (the bot
      # stays a trusted insider), closing the prompt-injection vector.
      maintainerLogins:
        - szymonrychu
      reporterLogins:
        - szymonrychu
      mergePolicy: afterApproval
      prReactionScope: labeledOrMentioned
      priorityLabel: tatara/priority
      cron:
        brainstorm:
          # Demand-driven since operator v1.35: NO schedule. The operator refills
          # toward targetOpenProposals on a level-triggered reconcile pass and
          # chains sessions back to back off the Task-completion watch edge. It
          # stops only when an agent reports action=exhausted, and resumes on a
          # foreign push, an operator merge for a clarify/incident/takeover Task,
          # a maintainer comment or close, or the tatara.dev/brainstorm-resume
          # annotation.
          enabled: true
          # Backlog TARGET, not a cap: the operator refills toward this level
          # across all 5 repos and launches the next session the moment a
          # maintainer approves or discards one. It never closes a proposal to
          # reconcile downward.
          targetOpenProposals: 3
          # Activate the stale-proposal reaper (operator #199): auto-close bot
          # proposals with no human engagement after 14 days.
          staleProposalDays: 14
          sources:
            - docs
            - memory
            - internet
        issueScan:
          maxPerRepo: 1
          # Stretched hourly -> every 4h (token conservation); webhooks cover real
          # issue activity, so the backstop scan can be less frequent.
          schedule: 0 */4 * * *
        # Project refiner: periodic grooming of open + recently-closed issues
        # across all repos - closes duplicates and already-implemented proposals,
        # tightens scope, splits too-broad issues, files followups. It USED to
        # ride the brainstorm cron as a pre-scan barrier; brainstorm has no cron
        # any more, so it carries its own schedule. Empty schedule disables it.
        refine:
          schedule: 0 6 * * *
          closedLookbackDays: 30
        # Dependency-upgrade agent. A tick mints AT MOST ONE upgrade Task and
        # only while the live lanes are under maxOpenUpgrades, so throughput is
        # the cron FREQUENCY, not a fan-out: six fires a day, at most two in
        # flight. Every-4h rather than daily because minimumReleaseAge is 0
        # below - a bleeding-edge project that only looks once a day spends most
        # of its life on a release it already decided to take.
        #
        # Minute 58 continues the deterministic 17-minute phase stagger the
        # per-repo reingestSchedules below already use (33 8, 50 8, 7 9, 24 9,
        # 41 9 -> 58), so an upgrade tick never lands on a reingest run, and it
        # keeps clear of minute 0 where issueScan fires on the same */4 hours.
        #
        # maxOpenUpgrades is EXPLICIT, never left to the operator's default of 1:
        # a kubebuilder default is applied on WRITE and never retroactively, so
        # changing it upstream would never reach this already-existing Project.
        upgrade:
          schedule: 58 */4 * * *
          maxOpenUpgrades: 2

repositories:
  - name: containers
    spec:
      url: "https://gitlab.com/szymonrychu/containers"
      defaultBranch: main
      ingestEnabled: true
      semanticIngest: true
      reingestSchedule: "33 8 * * *"
  - name: charts
    spec:
      url: "https://gitlab.com/szymonrychu/charts"
      defaultBranch: main
      ingestEnabled: true
      semanticIngest: true
      reingestSchedule: "50 8 * * *"
  - name: helmfile
    spec:
      url: "https://gitlab.com/szymonrychu/helmfile"
      defaultBranch: main
      ingestEnabled: true
      semanticIngest: true
      reingestSchedule: "7 9 * * *"
  - name: terraform
    spec:
      url: "https://gitlab.com/szymonrychu/terraform"
      defaultBranch: main
      ingestEnabled: true
      semanticIngest: true
      reingestSchedule: "24 9 * * *"
  - name: ansible
    spec:
      url: "https://gitlab.com/szymonrychu/ansible"
      defaultBranch: main
      ingestEnabled: true
      semanticIngest: true
      reingestSchedule: "41 9 * * *"
