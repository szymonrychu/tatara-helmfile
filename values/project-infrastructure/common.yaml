namespace: tatara

project:
  name: infrastructure
  spec:
    scmSecretRef: infrastructure-scm
    triggerLabel: tatara
    # item-4a activation: requires tatara-operator >= the release that ships
    # Project.spec.autoApproveTataraProposals (CRD field). Do not apply this
    # chart bump before that operator release is merged and published.
    autoApproveTataraProposals: true
    # Realistic steady-state (2026-07-04): un-held to full concurrency so both
    # projects do real work and we can observe whether the tiering/effort/cadence
    # improvements slow the subscription burn.
    # 4h pod life. agentPodTTLSeconds defaults to 3600, which would TTL-stop a
    # pod an hour in and make the 7200 turn timeout below unreachable. Pod-TTL
    # expiry is the GRACEFUL path (contract G.7: handoff turn, handoff note,
    # synthetic fallback), so a longer pod life is safe - it is the turn-timeout
    # path that tears a pod down hard.
    agentPodTTLSeconds: 14400
    maxConcurrentAgents: 5
    # Above maxConcurrentAgents so the hourly brainstorm always has a creation slot.
    maxOpenTasks: 6
    # operator#429: default AlertCapacity() is 1, so a single investigating
    # incident head-of-line-blocks every other incident for its whole
    # investigation window. Reserve 3 concurrent slots for the alert class.
    queue:
      alertCapacity: 3
    agent:
      # Per-kind tiering (token-conservation component 1): project-wide fallback
      # is Opus/high; only clarify+review drop to Sonnet with low/medium
      # effort. All other kinds inherit the high fallback. xhigh->high where it
      # stays Opus.
      effort: high
      model: claude-opus-5
      modelByKind:
        clarify: claude-sonnet-5
        review: claude-sonnet-5
      effortByKind:
        clarify: low
        review: medium
      image: harbor.szymonrichert.pl/containers/tatara-claude-code-wrapper:v2.0.2
      # Per-Task cumulative output-token runaway backstop for the turn-uncapped
      # implement/issueLifecycle kinds. TUNE from the component-6 per-kind token
      # telemetry; this is a safety ceiling, not a cost lever.
      maxTaskTokens: 3000000
      maxTurnsPerTask: 100
      permissionMode: bypassPermissions
      # Pin the agent-skills install (kills the `main` drift; component 5
      # / component 4b). HAND-MANAGED: see the note in
      # values/project-tatara/common.yaml. Move all three projects together;
      # check_pin_coverage.py's check_agent_pins() refuses a floating or absent value.
      skillsRef: v2.0.0
      # 7200: the "inactivity window, not wall-clock" contract is NOT what runs
      # today. The operator anchors the deadline on max(turn-started-at,
      # turn-last-activity-at) and refreshes the latter from the wrapper's
      # GetTurn (turncallback.go), but the wrapper never advances it past
      # submit - so the anchor is frozen and the window behaves as a hard
      # wall-clock cap on the whole turn. Live: mtg-decks#18 wrote a decklist,
      # captured a meta snapshot and ran the sim scripts for 60 minutes, and was
      # killed mid-work with nothing pushed. Until the wrapper stamps activity,
      # this value IS the longest a single turn may run.
      turnTimeoutSeconds: 7200
    # Read-only Grafana incident-response: operator provisions a per-project
    # grafana-mcp (Viewer SA token) + an alert-webhook receiver at
    # /operator/webhooks/infrastructure/grafana. Secret keys: serviceAccountToken
    # (mounted into grafana-mcp) + webhookSecret (alert bearer).
    grafana:
      enabled: true
      url: http://prometheus-grafana.monitoring.svc.cluster.local
      secretRef: infrastructure-grafana
    memory:
      # Volume sizing (pgStorage / pgWalStorage / neo4jStorage) is shared across
      # every project in values/memory-stack.yaml - do not re-declare it here.
      # This stack used to carry pgStorage: 10Gi and NO pgWalStorage at all, so
      # it silently ran on a 2Gi WAL volume and repeated the incidents already
      # fixed on project-tatara (#237, #263). Instance count stays per-project.
      pgInstances: 3
    scm:
      provider: gitlab
      owner: szymonrychu
      botLogin: szymonrychu-bot
      # Bot commit-author identity for agent commits (GitLab attributes commits to
      # the szymonrychu-bot account by author email).
      botEmail: sz.ymonrychu@gmail.com
      # The owner is a trusted insider: issues opened by szymonrychu go through
      # normal triage/approval, not third-party autoapprove.
      # Issue #102: szymonrychu is the sole maintainer/approver AND sole human
      # reporter. reporterLogins drops issues/comments from anyone else (the bot
      # stays a trusted insider), closing the prompt-injection vector.
      maintainerLogins:
        - szymonrychu
      reporterLogins:
        - szymonrychu
      mergePolicy: afterApproval
      prReactionScope: labeledOrMentioned
      priorityLabel: tatara/priority
      cron:
        brainstorm:
          # Demand-driven since operator v1.35: NO schedule. The operator refills
          # toward targetOpenProposals on a level-triggered reconcile pass and
          # chains sessions back to back off the Task-completion watch edge. It
          # stops only when an agent reports action=exhausted, and resumes on a
          # foreign push, an operator merge for a clarify/incident/takeover Task,
          # a maintainer comment or close, or the tatara.dev/brainstorm-resume
          # annotation.
          enabled: true
          # Backlog TARGET, not a cap: the operator refills toward this level
          # across all 5 repos and launches the next session the moment a
          # maintainer approves or discards one. It never closes a proposal to
          # reconcile downward.
          targetOpenProposals: 3
          # Activate the stale-proposal reaper (operator #199): auto-close bot
          # proposals with no human engagement after 14 days.
          staleProposalDays: 14
          sources:
            - docs
            - memory
            - internet
        issueScan:
          maxPerRepo: 1
          # Stretched hourly -> every 4h (token conservation); webhooks cover real
          # issue activity, so the backstop scan can be less frequent.
          schedule: 0 */4 * * *
        # Project refiner: periodic grooming of open + recently-closed issues
        # across all repos - closes duplicates and already-implemented proposals,
        # tightens scope, splits too-broad issues, files followups. It USED to
        # ride the brainstorm cron as a pre-scan barrier; brainstorm has no cron
        # any more, so it carries its own schedule. Empty schedule disables it.
        refine:
          schedule: 0 6 * * *
          closedLookbackDays: 30

repositories:
  - name: containers
    spec:
      url: "https://gitlab.com/szymonrychu/containers"
      defaultBranch: main
      ingestEnabled: true
      semanticIngest: true
      reingestSchedule: "0 6 * * *"
  - name: charts
    spec:
      url: "https://gitlab.com/szymonrychu/charts"
      defaultBranch: main
      ingestEnabled: true
      semanticIngest: true
      reingestSchedule: "0 6 * * *"
  - name: helmfile
    spec:
      url: "https://gitlab.com/szymonrychu/helmfile"
      defaultBranch: main
      ingestEnabled: true
      semanticIngest: true
      reingestSchedule: "0 6 * * *"
  - name: terraform
    spec:
      url: "https://gitlab.com/szymonrychu/terraform"
      defaultBranch: main
      ingestEnabled: true
      semanticIngest: true
      reingestSchedule: "0 6 * * *"
  - name: ansible
    spec:
      url: "https://gitlab.com/szymonrychu/ansible"
      defaultBranch: main
      ingestEnabled: true
      semanticIngest: true
      reingestSchedule: "0 6 * * *"
