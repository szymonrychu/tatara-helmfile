# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args:
          - --allow-multiple-documents
        exclude: '\.gotmpl$|\.secrets\.yaml$'
      - id: check-added-large-files
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, '{extends: default, rules: {line-length: {max: 320}, document-start: disable, truthy: {allowed-values: [''true'', ''false'', ''on'', ''off'']}}}']
        exclude: '\.gotmpl$|\.secrets\.yaml$'
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
  - repo: local
    hooks:
      # Same gate as .github/workflows/lint.yaml, shifted left: catch a project
      # drifting out of the CD pin fan-out before it is ever committed (#290).
      - id: cd-pin-coverage
        name: CD pin fan-out completeness guard
        entry: python3 .github/scripts/check_pin_coverage.py
        language: system
        pass_filenames: false
        files: '^(helmfile\.yaml\.gotmpl|values/[^/]+/common\.yaml)$'
